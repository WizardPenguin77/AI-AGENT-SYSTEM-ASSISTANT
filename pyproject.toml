[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-assistant"
version = "0.1.0"
description = "A permission-first terminal AI operating system assistant"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.40.0",
  "pydantic>=2.0.0",
  "rich>=13.0.0",
  "psutil>=5.9.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[project.scripts]
system-assistant = "system_assistant.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

